name: Sync with Upstream Repository

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库地址'
        required: true
        default: 'vbskycn/iptv'
      upstream_branch:
        description: '上游分支名称'
        required: true
        default: 'master'
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [master]

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      UPSTREAM_REPO: ${{ inputs.upstream_repo || 'vbskycn/iptv' }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid upstream repository"
            exit 1
          fi
          git check-ref-format "refs/heads/$UPSTREAM_BRANCH"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/source"

      - name: Sync with upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/source HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep all existing history; resolve workflow files before committing.
          if ! git merge --no-ff --no-commit upstream/source; then
            if ! git rev-parse --verify -q MERGE_HEAD >/dev/null; then
              echo "::error::Unable to start upstream merge"
              exit 1
            fi
          fi

          # Retain this fork's automation, including its permission fix.
          git restore --source=HEAD --staged --worktree -- .github/workflows

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" ]]; then
            printf '%s\n' "$conflicts"
            git merge --abort
            echo "::error::Content conflicts require manual resolution; nothing was pushed"
            exit 1
          fi

          git commit -m "Sync upstream $UPSTREAM_REPO ($UPSTREAM_BRANCH)"

          # A concurrent update rejects this push instead of overwriting history.
          git push origin HEAD:refs/heads/master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create sync summary
        if: success()
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            echo "## 上游同步成功" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 已是最新，无需同步" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '上游仓库：%s\n\n上游分支：%s\n' "$UPSTREAM_REPO" "$UPSTREAM_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "保留提交历史与本仓库工作流；内容冲突时停止同步。" >> "$GITHUB_STEP_SUMMARY"
